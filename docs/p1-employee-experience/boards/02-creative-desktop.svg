<text x="240" y="143" font-size="25" fill="#162941" font-weight="700">会员服务介绍短文</text>
<rect x="1010" y="119" width="132" height="28" rx="14" fill="#fff0dd" stroke="#fff0dd"/>
<text x="1022" y="138" font-size="12" fill="#a85c12" font-weight="600">当前作品未保存</text>
<rect x="1166" y="113" width="230" height="40" rx="8" fill="#245fe5" stroke="#245fe5"/>
<text x="1182" y="138" font-size="14" fill="#fff" font-weight="600">保存作品</text>
<text x="240" y="176" font-size="13" fill="#64748b" font-weight="400">林悦负责 · 今天17:00截止</text>
<text x="1030" y="176" font-size="13" fill="#245fe5" font-weight="400">任务要求与资料（2）  ▾</text>
<rect x="240" y="200" width="408" height="670" rx="12" fill="#fff" stroke="#dfe5ef"/>
<text x="262" y="234" font-size="17" fill="#162941" font-weight="600">讨论与修改</text>
<path d="M240 251h408" class="line"/>
<rect x="270" y="280" width="350" height="82" rx="12" fill="#eef3fb" stroke="#eef3fb"/>
<text x="286" y="307" font-size="13" fill="#162941" font-weight="400">我：帮我整理一段清楚的服务介绍，</text>
<text x="286" y="332" font-size="13" fill="#162941" font-weight="400">语气简洁，不加入未经确认的条件。</text>
<text x="266" y="403" font-size="14" fill="#162941" font-weight="600">AI 候选稿</text>
<text x="266" y="433" font-size="13" fill="#162941" font-weight="400">可以先介绍适用场景，再说明服务内容，</text>
<text x="266" y="459" font-size="13" fill="#162941" font-weight="400">最后提示读者查看正式服务条款。</text>
<text x="266" y="485" font-size="13" fill="#162941" font-weight="400"></text>
<text x="266" y="511" font-size="13" fill="#162941" font-weight="400">以下是供你整理的示例文字……</text>
<rect x="266" y="555" width="176" height="40" rx="8" fill="#fff" stroke="#dfe5ef"/>
<text x="282" y="580" font-size="14" fill="#162941" font-weight="600">选为当前作品</text>
<text x="266" y="620" font-size="12" fill="#64748b" font-weight="400">继续讨论不会自动修改已选定作品。</text>
<rect x="260" y="673" width="368" height="106" rx="10" fill="#fff" stroke="#dfe5ef"/>
<text x="276" y="702" font-size="13" fill="#64748b" font-weight="400">描述你想调整的地方……</text>
<text x="276" y="753" font-size="13" fill="#64748b" font-weight="400">＋ 添加资料</text>
<rect x="516" y="789" width="110" height="40" rx="8" fill="#245fe5" stroke="#245fe5"/>
<text x="532" y="814" font-size="14" fill="#fff" font-weight="600">发送</text>
<text x="260" y="846" font-size="11" fill="#64748b" font-weight="400">资料理解能力按实际接入显示</text>
<rect x="668" y="200" width="728" height="670" rx="12" fill="#fff" stroke="#dfe5ef"/>
<text x="692" y="234" font-size="17" fill="#162941" font-weight="600">当前作品</text>
<text x="1206" y="234" font-size="12" fill="#64748b" font-weight="400">正文   附件（1）</text>
<path d="M668 251h728" class="line"/>
<text x="698" y="294" font-size="23" fill="#162941" font-weight="600">把服务说明写得更容易理解</text>
<text x="698" y="340" font-size="16" fill="#162941" font-weight="400">这里是你选定并正在整理的交付正文。</text>
<text x="698" y="374" font-size="16" fill="#162941" font-weight="400">可以直接编辑，无需复制到另一个页面。</text>
<text x="698" y="408" font-size="16" fill="#162941" font-weight="400"></text>
<text x="698" y="442" font-size="16" fill="#162941" font-weight="400">先介绍读者遇到的场景，再说明已核实的服务内容。</text>
<text x="698" y="476" font-size="16" fill="#162941" font-weight="400">涉及资格条件和业务细节时，应以正式条款为准。</text>
<text x="698" y="510" font-size="16" fill="#162941" font-weight="400"></text>
<text x="698" y="544" font-size="16" fill="#162941" font-weight="400">示例内容不代表真实品牌服务事实，不可用于发布。</text>
<path d="M692 624h680" class="line"/>
<rect x="698" y="647" width="254" height="28" rx="14" fill="#eef3fb" stroke="#eef3fb"/>
<text x="710" y="666" font-size="12" fill="#245fe5" font-weight="600">服务说明.pdf · 已上传，未用于本次生成</text>
<text x="698" y="714" font-size="13" fill="#64748b" font-weight="400">只有这份正文与勾选附件会送审。聊天不会送审。</text>
