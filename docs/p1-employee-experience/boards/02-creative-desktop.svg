<text x="1212" y="39" font-size="13" fill="#64748b" font-weight="400">EN   /   林悦 · 制作</text>
<text x="1188" y="943" font-size="11" fill="#64748b" font-weight="400">P1静态设计 · 合成示例 · 不可操作</text>
