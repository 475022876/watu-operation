<text x="1084" y="405" font-size="13" fill="#64748b" font-weight="400">退回时，请写明要修改哪里。</text>
<text x="1084" y="430" font-size="13" fill="#64748b" font-weight="400">例如：开头简短一些，并保留</text>
<text x="1084" y="455" font-size="13" fill="#64748b" font-weight="400">正式条款中的适用条件。</text>
