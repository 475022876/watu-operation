    HealthData:
      type: object
      properties:
        status: { type: string, enum: [UP] }
        service: { type: string, enum: [vfib-enterprise-library] }
        appVersion: { type: string, example: '1.1.7' }
        policyVersion: { type: string, example: '1.0' }
        capabilities:
          type: object
          properties:
            knowledgeSearch: { type: boolean }
            assetSearch: { type: boolean }
            assetResolve: { type: boolean }
            admissionSubmit: { type: boolean }
            admissionSubmitWithReviews: { type: boolean }
            admissionArtifactPush: { type: boolean }
            admissionStatus: { type: boolean }
            admissionFinalDecision:
              type: string
              enum: [session-ticket-only]
              description: 明确声明最终审批**不接受**服务票据
            skillResolve: { type: boolean }
            changesPolling: { type: boolean }
            tickets: { type: boolean }
            publishedContentArchive:
              type: boolean
              enum: [false]
              description: 恒为 false（§J：资料库不镜像发布成品）
        scopes:
          type: array
          items: { $ref: '#/components/schemas/ServiceScope' }
        limits:
          type: object
          properties:
            maxPageSize: { type: integer }
            maxSnippetChars: { type: integer }
            ticketMaxSeconds: { type: integer }
            rateLimitPerMinute: { type: integer }
        signing:
          type: object
          properties:
            ticketKeySource:
              type: string
              enum: [configured, ephemeral-random-per-boot]
              description: 如实披露票据密钥来源；`ephemeral-random-per-boot` 意味着**重启后既有票据全部失效**
            requestSignature: { type: string, enum: [ed25519] }
        changesCursor: { type: integer }

    ServiceScope:
      type: string
      enum:
        - knowledge.search
        - assets.search
        - assets.read
        - admissions.write
        - admissions.read
        - skills.read
        - changes.read
        - tickets.issue

    TicketScope:
      type: string
      description: 票据范围 = 服务账户范围 ∩ 请求范围，再剔除 session-only 项
      enum:
        - knowledge.search
        - assets.search
        - assets.read
        - admissions.write
        - admissions.read
        - skills.read
        - changes.read
        - admission.final.decision

    Classification:
      type: object
      description: 密级（四级）。`rank` 越大越敏感。
      properties:
        key: { type: string, enum: [open, internal, restricted, executive] }
        label: { type: string }
        labelZh: { type: string }
        rank: { type: integer }

    KnowledgeHit:
      type: object
      properties:
        documentId: { type: string, example: VFIB-2026-0001 }
        libraryAssetId: { type: string, nullable: true }
        title: { type: string }
        version: { type: string }
        classification: { $ref: '#/components/schemas/Classification' }
        category: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string } } }
        subcategory: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string } } }
        approvedAt: { type: string, format: date-time, nullable: true }
        policyVersion: { type: string }
        isReusableAsset: { type: boolean }
        snippet: { type: string, nullable: true, description: 仅当 `canSendToExternalAI` 全链通过时非空 }
        contentWithheld: { type: boolean }
        withholdReason: { type: string, nullable: true }

    AssetMeta:
      type: object
      description: 只含可复用判定与追溯所需字段；**不含正文、不含文件路径**
      properties:
        libraryAssetId: { type: string, example: VFIB-ASSET-2026-0001 }
        libraryVersionId: { type: string, example: VFIB-ASSET-2026-0001-V1.0 }
        documentId: { type: string }
        title: { type: string }
        brandId: { type: string, nullable: true }
        marketingCategory: { $ref: '#/components/schemas/MarketingCategory' }
        libraryPrimaryCategory: { type: string, example: '02' }
        librarySubcategory: { type: string, example: '02.04' }
        classification: { $ref: '#/components/schemas/Classification' }
        licenseStatus: { $ref: '#/components/schemas/LicenseStatus' }
        reuseScope: { $ref: '#/components/schemas/ReuseScope' }
        aiReusePolicy: { type: string, enum: [blocked, allowed] }
        externalAiTransferPolicy: { type: string, enum: [blocked, allowed] }
        documentLevel: { type: string }
        version: { type: string }
        admissionState: { $ref: '#/components/schemas/AdmissionState' }
        isReusable: { type: boolean, enum: [true] }
        approvedAt: { type: string, format: date-time, nullable: true }
        policyVersion: { type: string }
        originSystem: { type: string, description: '非 workspace 者为营销资产' }

    AssetVersion:
      type: object
      properties:
        id: { type: string }
        version: { type: string }
        status: { type: string }
        size: { type: integer }
        uploadedAt: { type: string, format: date-time }

    MarketingCategory:
      type: string
      nullable: true
      description: '资产类别 A01—A08。⚠ provisional 标记为 true —— 须与 SPECIAL-01 原件逐条对照'
      enum: [A01, A02, A03, A04, A05, A06, A07, A08]

    LicenseStatus:
      type: string
      nullable: true
      description: '⚠ provisional 标记为 true（未经 SPECIAL-01 原件核验）'
      enum: [cleared, pending, restricted, expired, unknown]

    ReuseScope:
      type: string
      nullable: true
      description: '⚠ provisional 标记为 true（未经 SPECIAL-01 原件核验）'
      enum: [none, internal_reference, brand_kit, campaign_reuse, unrestricted]

    AdmissionState:
      type: string
      description: |
        状态机：`DRAFT → SUBMITTED → PRECHECK → REVIEWING → FINAL_APPROVAL_PENDING
        → FINAL_APPROVED → ADMISSION_PENDING → ADMITTED`；
        分支 `REVISION_REQUIRED` / `SYNC_FAILED` / `REJECTED` / `REVOKED` / `DEPRECATED`。

        ★ `FINAL_APPROVED ≠ 可复用`：必须再经入库校验才成为 `ADMITTED`。
      enum:
        - DRAFT
        - SUBMITTED
        - PRECHECK
        - REVIEWING
        - FINAL_APPROVAL_PENDING
        - FINAL_APPROVED
        - ADMISSION_PENDING
        - ADMITTED
        - REVISION_REQUIRED
        - REJECTED
        - SYNC_FAILED
        - REVOKED
        - DEPRECATED

    AdmissionInput:
      type: object
      description: |
        ⚠ 同时接受 camelCase 与 snake_case；服务端以 `normalizeAdmissionInput()` 归一化。
        校验未通过时响应 message 内含**逐条**错误原因。
      required: [idempotencyKey, originSystem, originObjectId, libraryPrimaryCategory, classification, licenseStatus, title]
      properties:
        idempotencyKey:
          type: string
          description: 幂等键。1-120 位 `[A-Za-z0-9_.:-]`；`(originSystem, idempotencyKey)` 唯一确定一次提交
        originSystem:
          type: string
          enum: [marketing_os]
          description: 服务端对集成路径**强制**覆写为 `marketing_os`
        originObjectId: { type: string, description: 来源对象 ID（幂等与母版冲突判定用） }
        originVersionId: { type: string, nullable: true }
        contentHash:
          type: string
          nullable: true
          description: 64 位**小写** hex（sha256）；用于母版冲突检测。服务端入库时会**重算**哈希
        brandId: { type: string, description: 缺省取票据品牌 }
        marketingCategory: { $ref: '#/components/schemas/MarketingCategory' }
        libraryPrimaryCategory: { type: string, description: 必须是七大资料区之一（01-07） }
        librarySubcategory: { type: string, description: 必须位于所选的 libraryPrimaryCategory 下 }
        classification: { type: string, enum: [open, internal, restricted, executive] }
        licenseStatus: { $ref: '#/components/schemas/LicenseStatus' }
        reuseScope: { $ref: '#/components/schemas/ReuseScope' }
        aiReusePolicy: { type: string, enum: [blocked, allowed], default: blocked }
        externalAiTransferPolicy: { type: string, enum: [blocked, allowed], default: blocked }
        title: { type: string, maxLength: 180 }
        fileName: { type: string, nullable: true, maxLength: 180 }
        fileSize: { type: integer, nullable: true }
        note: { type: string, maxLength: 500 }

    SkillStatus:
      type: string
      description: 三道门：登记（DRAFT）→ 批准（APPROVED，**仍不可引用**）→ 生效（EFFECTIVE 才可用）
      enum: [DRAFT, APPROVED, EFFECTIVE, DEPRECATED, REVOKED]

    SkillPublicView:
      type: object
      description: |
        `publicView()` —— **不含** `approvedBy` / 审批备注 / `documentId` / 内部留痕。
        `hash` 在**生效瞬间**由服务端冻结，作为生成任务的规则快照引用。
      properties:
        skillId: { type: string, example: VFIB-SKILL-2026-0001 }
        version: { type: string, example: V1.0 }
        brandId: { type: string }
        subcategoryId: { type: string, example: '02.01' }
        classification: { type: string }
        visibleBrands: { type: array, items: { type: string } }
        title: { type: string }
        summary: { type: string }
        status: { $ref: '#/components/schemas/SkillStatus' }
        hash: { type: string, nullable: true, description: 生效前为 null }
        effectiveAt: { type: string, format: date-time, nullable: true }

    EventType:
      type: string
      description: |
        品牌隔离：`admission.state.changed` / `skill.version.changed` 按票据品牌过滤；
        其余为全局类事件，对所有调用方可见（不含品牌业务内容）。
      enum:
        - policy.version.changed
        - admission.state.changed
        - asset.revoked
        - asset.deprecated
        - skill.version.changed
        - permission.changed
        - service_account.changed
